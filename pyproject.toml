[project]
name = "spectroscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "nicegui>=3.16.0",
    "pyinstaller>=6.22.2",
